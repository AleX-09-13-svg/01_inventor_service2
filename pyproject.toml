[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inventor-service"
version = "0.1.0"
description = "Convenient Python wrapper for Autodesk Inventor API"
requires-python = ">=3.10"
dependencies = [
    "pywin32",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["inventor_service*"]

[tool.setuptools.package-data]
inventor_service = ["py.typed"]
